name: Windows package

# 这个分支只做可下载的 Windows 构建产物，不创建 tag / Release。
# 正式发布仍由 main 的发布流程处理。
on:
  push:
    branches:
      - sync/upstream-20260924
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows onedir
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python --version
          pyinstaller --version

      - name: Compile-check Python sources
        shell: pwsh
        run: |
          python -m compileall -q main.py app core
          if ($LASTEXITCODE -ne 0) { throw "Python compile check failed" }

      - name: Run lightweight project self-checks
        shell: pwsh
        run: |
          python -m app.update
          python core/providers.py
          python core/engine.py
          python -c "from app import settings; assert settings.auto_send() is False; assert settings.auto_send_whitelist() == []; print('settings defaults ok')"
          python -c "import app.overlay, app.debugwin; import core.engine, core.draft, core.jev_client, core.llm, core.providers, core.questions; print('critical imports ok')"

      - name: Stamp development build version
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $ver = "0.1.10-sync-$short"
          Set-Content -Path app/version.py -Value ('VERSION = "' + $ver + '"') -Encoding utf8
          "BUILD_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_ZIP=jev-chat-windows-$ver.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Content app/version.py

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean jev.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Validate onedir output
        shell: pwsh
        run: |
          $root = 'dist\jev-chat-windows'
          $exe = Join-Path $root 'jev-chat-windows.exe'
          if (-not (Test-Path $exe)) {
            throw "Missing executable: $exe"
          }

          $banner = Get-ChildItem -Path $root -Recurse -File -Filter 'wechat-mp.png' | Select-Object -First 1
          if (-not $banner) {
            throw "Missing packaged resource: docs/wechat-mp.png"
          }

          Copy-Item -Path LICENSE, NOTICE -Destination $root -Force
          if (-not (Test-Path (Join-Path $root 'LICENSE'))) { throw "LICENSE was not copied" }
          if (-not (Test-Path (Join-Path $root 'NOTICE'))) { throw "NOTICE was not copied" }

          $exeInfo = Get-Item $exe
          $fileCount = (Get-ChildItem -Path $root -Recurse -File).Count
          $totalBytes = (Get-ChildItem -Path $root -Recurse -File | Measure-Object -Property Length -Sum).Sum
          "Executable: {0:N1} MB" -f ($exeInfo.Length / 1MB)
          "Files: $fileCount"
          "Onedir size: {0:N1} MB" -f ($totalBytes / 1MB)
          "Banner: $($banner.FullName)"

      - name: Create ZIP
        shell: pwsh
        run: |
          if (Test-Path $env:BUILD_ZIP) {
            Remove-Item $env:BUILD_ZIP -Force
          }
          Compress-Archive -Path 'dist\jev-chat-windows' -DestinationPath $env:BUILD_ZIP -CompressionLevel Optimal
          if (-not (Test-Path $env:BUILD_ZIP)) {
            throw "ZIP was not created"
          }
          "ZIP: $env:BUILD_ZIP"
          "ZIP size: {0:N1} MB" -f ((Get-Item $env:BUILD_ZIP).Length / 1MB)

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-windows-${{ github.sha }}
          path: jev-chat-windows-0.1.10-sync-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
